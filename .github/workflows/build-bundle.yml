name: Build Code.gs bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/**.gs'
      - 'build.mjs'
  pull_request:
    paths:
      - 'src/**.gs'
      - 'build.mjs'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # On a PR the bundle must already be committed, so reviewers see the
      # generated output in the diff.
      - name: Verify bundle is current
        if: github.event_name == 'pull_request'
        run: node build.mjs --check

      # On main, regenerate and commit so dist/Code.gs can never go stale.
      - name: Rebuild bundle
        if: github.event_name == 'push'
        run: node build.mjs

      - name: Commit refreshed bundle
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dist/Code.gs; then
            echo "dist/Code.gs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Code.gs
          git commit -m "Rebuild dist/Code.gs from src/"
          git push
